- name: Download Trivy binary
  ansible.builtin.get_url:
    url: "https://github.com/aquasecurity/trivy/releases/download/{{ trivy_version }}/trivy_{{ trivy_version[1:] }}_Linux-64bit.tar.gz"
    dest: "/tmp/trivy.tar.gz"
    checksum: "sha256:e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7"
    force: true
    mode: "0644"
  register: trivy_download

- name: Extract Trivy binary
  ansible.builtin.unarchive:
    src: "/tmp/trivy.tar.gz"
    dest: "/tmp/"
    remote_src: true
    creates: "/tmp/trivy"
    mode: "0644"

- name: Move Trivy binary to /usr/local/bin and set correct permissions
  ansible.builtin.copy:
    src: "/tmp/trivy"
    dest: "/usr/local/bin/trivy"
    mode: "0755"
    force: true
    remote_src: true
  notify: Verify Trivy installation

- name: Trivy role completed
  ansible.builtin.meta: flush_handlers
